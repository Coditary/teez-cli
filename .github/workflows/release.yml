name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            binary_path: build/teez
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            binary_path: build/teez
          - name: macos-x86_64
            runner: macos-15-intel
            platform: macos
            arch: x86_64
            binary_path: build/teez
          - name: macos-aarch64
            runner: macos-15
            platform: macos
            arch: aarch64
            binary_path: build/teez

    steps:
      - uses: actions/checkout@v4
        with:
          path: teez-cli

      - name: Resolve dependency ref
        id: dep_ref
        shell: bash
        run: |
          set -euo pipefail
          REF="main"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if gh api "repos/${GITHUB_REPOSITORY_OWNER}/teez-core/git/ref/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1 \
              && gh api "repos/${GITHUB_REPOSITORY_OWNER}/teez-worker/git/ref/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              REF="${GITHUB_REF_NAME}"
            fi
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/teez-core
          path: teez-core
          ref: ${{ steps.dep_ref.outputs.ref }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/teez-worker
          path: teez-worker
          ref: ${{ steps.dep_ref.outputs.ref }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared-Cpp
          path: teez-core/Shared-Cpp

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared-Cpp
          path: teez-worker/Shared-Cpp

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            liblua5.4-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev \
            zstd

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          set -euo pipefail
          brew install curl lua ncurses pkg-config zlib zstd
          echo "PKG_CONFIG_PATH=$(brew --prefix ncurses)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix ncurses)" >> "${GITHUB_ENV}"

      - name: Build release binary
        working-directory: teez-cli
        run: |
          set -euo pipefail
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Smoke test binary
        working-directory: teez-cli
        run: |
          set -euo pipefail
          ./${{ matrix.binary_path }} --help

      - name: Package release archive
        working-directory: teez-cli
        run: |
          set -euo pipefail
          python3 scripts/ci/package_binary.py \
            --version "$GITHUB_REF_NAME" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --binary "${{ matrix.binary_path }}" \
            --output-dir dist

      - name: Package ReqPack artifact
        working-directory: teez-cli
        run: |
          set -euo pipefail
          python3 scripts/ci/package_reqpack.py \
            --version "$GITHUB_REF_NAME" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --binary "${{ matrix.binary_path }}" \
            --output-dir dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            teez-cli/dist/*.tar.gz
            teez-cli/dist/*.rqp
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: teez-cli

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Build ReqPack repository index
        working-directory: teez-cli
        run: |
          set -euo pipefail
          python3 scripts/ci/build_reqpack_index.py --dist-dir ../dist --output ../dist/index.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="Automated release for teez ${VERSION}.

          Includes tar.gz binaries and ReqPack .rqp packages for Linux and macOS (x86_64 and aarch64), plus index.json for ReqPack repositories."
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GH_REPO" --title "teez ${VERSION}" --notes "$NOTES"
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GH_REPO" --draft=false --latest --title "teez ${VERSION}" --notes "$NOTES"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.rqp dist/index.json --repo "$GH_REPO" --clobber
